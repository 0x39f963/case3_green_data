services:
  benchmark-postgres:
    image: postgres:16
    container_name: benchmark_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BENCH_DB:-bench}
      POSTGRES_USER: ${BENCH_USER:-bench}
      POSTGRES_PASSWORD: ${BENCH_PASSWORD:-bench}
    volumes:
      - benchmark_pg_data:/var/lib/postgresql/data
    ports:
      - "${BENCH_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BENCH_USER:-bench} -d ${BENCH_DB:-bench}"]
      interval: 5s
      timeout: 5s
      retries: 12

  benchmark-api:
    build:
      context: ..
      dockerfile: deploy/benchmark/Dockerfile
    container_name: benchmark_api
    restart: unless-stopped
    depends_on:
      benchmark-postgres:
        condition: service_healthy
    environment:
      BENCHMARK_DSN: postgresql://${BENCH_USER:-bench}:${BENCH_PASSWORD:-bench}@benchmark-postgres:5432/${BENCH_DB:-bench}
      BENCHMARK_INGEST_TOKEN: ${BENCHMARK_INGEST_TOKEN}
      BENCHMARK_HMAC_SECRET: ${BENCHMARK_HMAC_SECRET:-}
      BENCHMARK_MAX_BODY_MB: ${BENCHMARK_MAX_BODY_MB:-25}
      BENCHMARK_RATE_LIMIT_PER_MIN: ${BENCHMARK_RATE_LIMIT_PER_MIN:-60}
      BENCHMARK_LOG_LEVEL: ${BENCHMARK_LOG_LEVEL:-INFO}
      BENCHMARK_GIT_SHA: ${BENCHMARK_GIT_SHA:-unknown}
      BENCHMARK_RUNNER_API_URL: ${BENCHMARK_RUNNER_API_URL:-http://host.docker.internal:18002}
      BENCHMARK_RUNNER_STORE_URL: ${BENCHMARK_RUNNER_STORE_URL:-http://127.0.0.1:8080}
      BENCHMARK_JUDGE_EXECUTOR_URL: ${BENCHMARK_JUDGE_EXECUTOR_URL:-http://host.docker.internal:18002}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data/eval:/app/data/eval:rw
      - ../data/bench:/app/data/bench:rw
    ports:
      - "${BENCH_API_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  benchmark_pg_data:
